name: Publish CassadyNet

on:
  schedule:
    - cron: '0 * * * *'   # Every hour at :00
  workflow_dispatch:        # Allow manual trigger from GitHub UI

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write   # Required to push data files back to the repo

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # 2. Python setup
      # -----------------------------------------------------------------------
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      # -----------------------------------------------------------------------
      # 3. Restore the stories database from cache.
      #    save-always: true ensures the DB is saved even if later steps fail,
      #    so it never resets back to an empty state.
      # -----------------------------------------------------------------------
      - name: Restore stories database
        uses: actions/cache@v4
        with:
          path: data/stories.db
          key: stories-db-${{ github.run_number }}
          restore-keys: |
            stories-db-
          save-always: true

      # -----------------------------------------------------------------------
      # 4. Show DB stats before the run (helps diagnose stale-story issues)
      # -----------------------------------------------------------------------
      - name: DB diagnostics (pre-run)
        run: |
          python3 - <<'EOF'
          import sqlite3, os
          from pathlib import Path
          db = Path('data/stories.db')
          if not db.exists():
              print("⚠️  No stories.db found — starting fresh")
          else:
              size_mb = db.stat().st_size / 1024 / 1024
              conn = sqlite3.connect(db)
              total   = conn.execute("SELECT COUNT(*) FROM stories").fetchone()[0]
              scored  = conn.execute("SELECT COUNT(*) FROM stories WHERE score >= 25").fetchone()[0]
              fresh   = conn.execute("SELECT COUNT(*) FROM stories WHERE score >= 25 AND published > datetime('now','-72 hours')").fetchone()[0]
              unscored = conn.execute("SELECT COUNT(*) FROM stories WHERE (score IS NULL OR score = 0) AND published > datetime('now','-48 hours')").fetchone()[0]
              newest  = conn.execute("SELECT published FROM stories ORDER BY id DESC LIMIT 1").fetchone()
              conn.close()
              print(f"📦 DB size: {size_mb:.1f} MB")
              print(f"📰 Total stories: {total:,}")
              print(f"⭐ Scored >= 25: {scored:,}")
              print(f"🆕 Fresh & scored (72h): {fresh:,}")
              print(f"❓ Unscored (last 48h): {unscored:,}")
              print(f"🕐 Newest story added: {newest[0] if newest else 'unknown'}")
          EOF

      # -----------------------------------------------------------------------
      # 5. Pre-flight checks — fail fast if secrets are missing or invalid
      # -----------------------------------------------------------------------
      - name: Pre-flight checks
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          echo "🔍 Checking required secrets..."

          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "❌ FATAL: ANTHROPIC_API_KEY secret is not set!"
            echo "   Go to: GitHub repo → Settings → Secrets and variables → Actions"
            echo "   Add a secret named ANTHROPIC_API_KEY with your Anthropic API key"
            exit 1
          else
            echo "✅ ANTHROPIC_API_KEY is set (length: ${#ANTHROPIC_API_KEY} chars)"
          fi

          if [ -z "$SFTP_PASSWORD" ]; then
            echo "⚠️  WARNING: SFTP_PASSWORD is not set — upload step will fail"
          else
            echo "✅ SFTP_PASSWORD is set"
          fi

          # Quick API connectivity test (no tokens charged — just validates the key)
          python3 - <<'PYEOF'
          import os, sys
          try:
              import anthropic
              client = anthropic.Anthropic(api_key=os.environ["ANTHROPIC_API_KEY"])
              # models.list() is free and confirms the key is valid
              client.models.list()
              print("✅ Anthropic API key is valid and reachable")
          except anthropic.AuthenticationError:
              print("❌ FATAL: ANTHROPIC_API_KEY is set but INVALID (authentication error)")
              sys.exit(1)
          except Exception as e:
              print(f"⚠️  Could not verify API key: {e}")
              # Don't fail — might be a transient network issue
          PYEOF

      # -----------------------------------------------------------------------
      # 6. Run the full publish pipeline
      # -----------------------------------------------------------------------
      - name: Run publish pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: python3 scripts/publish.py

      # -----------------------------------------------------------------------
      # 7. Show DB stats after the run
      # -----------------------------------------------------------------------
      - name: DB diagnostics (post-run)
        if: always()
        run: |
          python3 - <<'EOF'
          import sqlite3
          from pathlib import Path
          db = Path('data/stories.db')
          if db.exists():
              conn = sqlite3.connect(db)
              total   = conn.execute("SELECT COUNT(*) FROM stories").fetchone()[0]
              fresh   = conn.execute("SELECT COUNT(*) FROM stories WHERE score >= 25 AND published > datetime('now','-72 hours')").fetchone()[0]
              unscored = conn.execute("SELECT COUNT(*) FROM stories WHERE (score IS NULL OR score = 0) AND published > datetime('now','-48 hours')").fetchone()[0]
              conn.close()
              print(f"✅ Post-run: {total:,} total | {fresh:,} fresh scored | {unscored:,} awaiting scoring")
          EOF

      # -----------------------------------------------------------------------
      # 8. Commit updated state files back to the repo.
      #    Runs even if publish failed so data files stay in sync.
      # -----------------------------------------------------------------------
      - name: Commit updated data files
        if: always()
        run: |
          git config user.name "CassadyNet Bot"
          git config user.email "bot@cassadynet.com"
          git add \
            data/active_polls.json \
            data/archived_polls.json \
            data/analysis_index.json \
            data/story_clusters.json \
            data/posted_bluesky.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No data file changes to commit."
          else
            git pull --rebase --autostash origin main
            git commit -m "chore: auto-update [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            git push
          fi
